<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: white; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 36px 32px; width: 100%; max-width: 360px;
        }
        .login-title { font-size: 1.15rem; font-weight: 800; color: #1a1a2e; margin-bottom: 4px; }
        .login-sub { font-size: 0.82rem; color: #8a8f9c; margin-bottom: 22px; }
        .btn-navy { background: #1a1a2e; color: #fff; border: none; }
        .btn-navy:hover { background: #2d2d4e; color: #fff; }
        .code-input {
            letter-spacing: 0.4em; text-align: center; font-size: 1.3rem; font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .msg { font-size: 0.8rem; font-weight: 600; margin-top: 10px; white-space: pre-line; }
        .msg.ok { color: #1f8a5f; }
        .msg.err { color: #c14a4a; }
        #step2 { display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-title">📡 알림 시스템</div>
    <div class="login-sub">Slack으로 받은 코드로 로그인하세요</div>

    <div id="step1">
        <button class="btn btn-navy w-100" id="requestBtn">Slack으로 코드 받기</button>
    </div>

    <div id="step2">
        <label class="form-label small text-muted mt-3">Slack으로 받은 6자리 코드</label>
        <input type="text" class="form-control code-input" id="codeInput" maxlength="6" inputmode="numeric" placeholder="000000" autocomplete="one-time-code">
        <button class="btn btn-navy w-100 mt-3" id="verifyBtn">로그인</button>
        <button class="btn btn-outline-secondary btn-sm w-100 mt-2" id="resendBtn">코드 다시 받기</button>
    </div>

    <div class="msg" id="msg"></div>
</div>

<script>
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const msg = document.getElementById('msg');
    const codeInput = document.getElementById('codeInput');

    function showMsg(text, ok) {
        msg.textContent = text;
        msg.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    async function requestCode() {
        showMsg('요청 중...', true);
        try {
            const res = await fetch('/api/login/request-code', { method: 'POST' });
            const json = await res.json();
            if (json.status !== 'success') { showMsg(json.message || '요청 실패', false); return; }
            showMsg(json.message, true);
            step1.style.display = 'none';
            step2.style.display = '';
            codeInput.value = '';
            codeInput.focus();
        } catch (e) {
            showMsg('요청 중 오류: ' + e.message, false);
        }
    }

    document.getElementById('requestBtn').addEventListener('click', requestCode);
    document.getElementById('resendBtn').addEventListener('click', requestCode);

    document.getElementById('verifyBtn').addEventListener('click', async () => {
        const code = codeInput.value.trim();
        if (!code) { showMsg('코드를 입력해주세요.', false); return; }
        showMsg('확인 중...', true);
        try {
            const res = await fetch('/api/login/verify', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            const json = await res.json();
            if (json.status !== 'success') { showMsg(json.message || '로그인 실패', false); return; }
            window.location.href = '/';
        } catch (e) {
            showMsg('로그인 중 오류: ' + e.message, false);
        }
    });

    codeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('verifyBtn').click();
    });
</script>
</body>
</html>
