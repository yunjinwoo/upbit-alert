<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서버 모니터링</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
        .dashboard-container { margin-top: 30px; margin-bottom: 50px; }
        .header-title { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .table-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .table-container h5 { font-weight: bold; margin-bottom: 12px; }
        .table-scroll { overflow-x: auto; }
        .monitor-table { font-size: 0.85rem; }
        .overall-badge { font-size: 1rem; padding: 8px 14px; }
        .log-lines { font-family: Consolas, monospace; font-size: 0.78rem; max-height: 320px; overflow: auto; background: #f8f9fa; border-radius: 6px; padding: 8px; white-space: pre-wrap; word-break: break-all; }
        .jobs-text { white-space: pre-wrap; font-size: 0.85rem; }
        .main-navbar { background-color: #1a1a2e; }
        .main-navbar .navbar-brand { color: #fff; font-weight: bold; }
        .main-navbar .nav-link { color: rgba(255,255,255,0.75) !important; font-size: 0.82rem; }
        .main-navbar .nav-link:hover, .main-navbar .nav-link.active { color: #fff !important; }
        .main-navbar .nav-link.active { border-bottom: 2px solid #4da6ff; }
    </style>
</head>
<body>
{% include '_navbar.html' %}
<div class="container dashboard-container">
    <div class="header-title">
        <div>
            <h3 class="mb-1">🩺 서버 모니터링</h3>
            <div class="text-muted small">수집·스케줄·로그 상태를 읽기 전용으로 보여줍니다(매일 아침 자동 점검과 같은 <code>/api/health</code>). 점검 시각 <b id="checkedAt">-</b> · 1분마다 자동 새로고침</div>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <span id="overallBadge" class="badge bg-secondary overall-badge">불러오는 중...</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="loadAll()">새로고침</button>
        </div>
    </div>

    <!-- 시장 현재 상황 — 업종 일자별지수 페이지에 있던 메시지(시장 판단 + 주요 지수)를 옮겨 왔다 -->
    <div class="table-container">
        <h5>📢 시장 현재 상황</h5>
        <div id="statusRegime" class="small mb-1">주식 시장 판단 불러오는 중...</div>
        <div id="statusIndices" class="small">주요 지수 불러오는 중...</div>
    </div>

    <div class="table-container">
        <h5>📥 수집 데이터 <small class="text-muted fw-normal">테이블별 마지막 저장 시각</small></h5>
        <div class="table-scroll">
            <table class="table table-sm table-hover monitor-table mb-0">
                <thead class="table-light"><tr><th>상태</th><th>항목</th><th>마지막 저장</th><th>기대</th><th>프로세스(PM2)</th><th>비고</th></tr></thead>
                <tbody id="freshnessBody"><tr><td colspan="6" class="text-muted">불러오는 중...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="table-container">
        <h5>⏱ 스케줄 <small class="text-muted fw-normal">최근 24시간</small></h5>
        <div id="jobsText" class="jobs-text text-muted">불러오는 중...</div>
    </div>

    <div class="table-container">
        <h5>📄 로그 <small class="text-muted fw-normal">최근 24시간 · app.log 끝부분</small></h5>
        <div id="logSummary" class="small mb-2 text-muted">불러오는 중...</div>
        <div id="logLines" class="log-lines" style="display:none"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const REFRESH_MS = 60 * 1000;
    const STATUS_BADGE = {
        ok: ['bg-success', '정상'], stale: ['bg-warning text-dark', '밀림'], empty: ['bg-warning text-dark', '행 없음'],
        missing: ['bg-danger', '없음'], unreadable: ['bg-danger', '형식 오류'],
    };

    // 서버가 준 문자열(로그 줄, 오류 문구)을 그대로 innerHTML 에 넣지 않도록 이스케이프한다
    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    }

    function fmt(v, decimals = 2) {
        const n = parseFloat(v);
        return isNaN(n) ? '-' : n.toLocaleString('ko-KR', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
    }

    function rateSpan(rate) {
        if (rate === null || rate === undefined || isNaN(rate)) return '';
        const cls = rate > 0 ? 'text-danger' : rate < 0 ? 'text-primary' : '';
        return ` <span class="${cls}">(${rate > 0 ? '+' : ''}${fmt(rate)}%)</span>`;
    }

    function renderHealth(data) {
        document.getElementById('checkedAt').textContent = data.checked_at || '-';
        const badge = document.getElementById('overallBadge');
        const ok = data.overall === 'ok';
        badge.className = `badge overall-badge ${ok ? 'bg-success' : 'bg-warning text-dark'}`;
        badge.textContent = ok ? '✅ 정상' : '⚠️ 확인 필요';

        const rows = (data.freshness || []).map(f => {
            const [cls, label] = STATUS_BADGE[f.status] || ['bg-secondary', f.status];
            return `<tr>
                <td><span class="badge ${cls}">${esc(label)}</span></td>
                <td>${esc(f.label)}</td>
                <td>${esc(f.latest || '-')}</td>
                <td>${esc(f.expected || '-')}</td>
                <td class="text-muted">${esc(f.process || '-')}</td>
                <td class="text-muted">${esc(f.note || '')}</td>
            </tr>`;
        });
        document.getElementById('freshnessBody').innerHTML = rows.join('') || '<tr><td colspan="6" class="text-muted">항목 없음</td></tr>';

        const jobs = data.jobs || {};
        const jobsEl = document.getElementById('jobsText');
        jobsEl.textContent = jobs.text || '-';
        jobsEl.className = 'jobs-text' + ((jobs.failing || []).length || !jobs.total_runs ? ' text-danger' : '');

        const log = data.log || {};
        const summaryEl = document.getElementById('logSummary');
        const linesEl = document.getElementById('logLines');
        if (log.status === 'missing') {
            summaryEl.innerHTML = `<span class="text-danger">${esc(log.note)}</span>`;
            linesEl.style.display = 'none';
            return;
        }
        const orderFail = log.order_failure_count
            ? `<span class="badge bg-danger me-2">실거래 주문 실패 ${log.order_failure_count}건</span>` : '';
        summaryEl.innerHTML = `${orderFail}ERROR <b>${log.error_count ?? '-'}</b>건 · WARNING <b>${log.warning_count ?? '-'}</b>건`
            + ` · 마지막 기록 ${esc(log.last_line_at || '-')}`
            + (log.tail_only ? ' <span class="text-muted">(파일 끝 512KB만 집계)</span>' : '');
        const errors = log.recent_errors || [];
        linesEl.style.display = errors.length ? '' : 'none';
        linesEl.textContent = errors.join('\n');
    }

    async function loadHealth() {
        try {
            const res = await fetch('api/health');
            const result = await res.json();
            if (result.status !== 'success') throw new Error(result.message || '조회 실패');
            renderHealth(result);
        } catch (e) {
            console.error(e);
            const badge = document.getElementById('overallBadge');
            badge.className = 'badge overall-badge bg-danger';
            badge.textContent = '❌ 상태 조회 실패';
        }
    }

    // 주식 시장 판단 — market-regime-bot이 저장한 값(슬랙 알림과 같은 판정)을 그대로 보여준다
    async function loadStockRegime() {
        const el = document.getElementById('statusRegime');
        try {
            const res = await fetch('api/stock-regime');
            const result = await res.json();
            if (result.status !== 'success') throw new Error(result.message || '조회 실패');
            const snap = result.data, st = snap.state;
            if (!st || !st.confirmed) {
                el.innerHTML = `🧭 주식 시장 판단: <span class="text-muted">아직 판정 전 (평일 ${esc(snap.market_hours)}에 30분마다 판정)</span>`;
                return;
            }
            const r = snap.regimes[st.confirmed];
            const last = st.last_result || {};
            const score = (last.score !== undefined && last.score !== null) ? ` (점수 ${last.score > 0 ? '+' : ''}${last.score})` : '';
            const items = (last.items || []).map(i => `${esc(i.label)} ${esc(i.text)} (${i.point > 0 ? '+' : ''}${i.point})`).join(' · ');
            let pending = '';
            if (st.pending && snap.regimes[st.pending]) {
                const p = snap.regimes[st.pending];
                pending = ` · <span class="text-warning">${p.emoji} ${esc(p.label)} 전환 대기 ${st.pending_count}/${snap.confirm_count}</span>`;
            }
            el.innerHTML = `🧭 주식 시장 판단: <b>${r.emoji} ${esc(r.label)}</b>${score}${pending}`
                + ` <span class="text-muted">· 확정 ${esc(st.confirmed_at)} · 마지막 판정 ${esc(st.checked_at)}</span>`
                + (last.crash ? ' · <span class="text-primary">⚠️ 코스피 급락</span>' : '')
                + (items ? `<div class="text-muted">${items} · 참고 전략: ${esc(r.strategy)}</div>` : '');
        } catch (e) {
            console.error(e);
            el.innerHTML = '🧭 주식 시장 판단: <span class="text-muted">조회 실패</span>';
        }
    }

    async function loadStockIndices() {
        const box = document.getElementById('statusIndices');
        try {
            const res = await fetch('api/stock-indices');
            const result = await res.json();
            if (result.status !== 'success') throw new Error(result.message || '조회 실패');
            box.innerHTML = '📈 주요 지수: ' + result.data.map(r => r.value === null
                ? `${esc(r.name)} <span class="text-muted">조회 실패</span>`
                : `<b>${esc(r.name)}</b> ${fmt(r.value)}${rateSpan(r.change_pct)}`).join(' · ')
                + ` <span class="text-muted">· ${new Date().toLocaleTimeString()} 기준 (해외 지수는 미국 장 마감 시 직전 종가)</span>`;
        } catch (e) {
            console.error(e);
            box.innerHTML = '📈 주요 지수: <span class="text-muted">조회 실패</span>';
        }
    }

    function loadAll() {
        loadHealth();
        loadStockRegime();
        loadStockIndices();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadAll();
        // 상태는 DB·로그만 읽어 가볍다 → 1분마다. 지수는 외부 조회라 처음과 수동 새로고침 때만 부른다.
        setInterval(() => { loadHealth(); loadStockRegime(); }, REFRESH_MS);
    });
</script>
</body>
</html>
