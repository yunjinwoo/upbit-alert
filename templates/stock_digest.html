<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>저녁 주식 요약</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
        .dashboard-container { margin-top: 30px; margin-bottom: 50px; }
        .header-title { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .table-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .table-container h5 { font-weight: bold; margin-bottom: 12px; }
        .table-scroll { overflow-x: auto; }
        .digest-table { font-size: 0.85rem; }
        .digest-table th, .digest-table td { white-space: nowrap; }
        .up-rate { color: #d60000; font-weight: bold; }
        .down-rate { color: #0049af; font-weight: bold; }
        .ticker-link { text-decoration: none; color: #0049af; font-weight: bold; }
        .ticker-link:hover { text-decoration: underline; }
        .reason-tag { display: inline-block; background: #e8f0fe; color: #1a1a2e; border-radius: 4px; padding: 1px 6px; font-size: 0.75rem; margin: 1px; }
        .grade-A { background: #d60000; }
        .grade-B { background: #f59f00; }
        .main-navbar { background-color: #1a1a2e; }
        .main-navbar .navbar-brand { color: #fff; font-weight: bold; }
        .main-navbar .nav-link { color: rgba(255,255,255,0.75) !important; font-size: 0.82rem; }
        .main-navbar .nav-link:hover, .main-navbar .nav-link.active { color: #fff !important; }
        .main-navbar .nav-link.active { border-bottom: 2px solid #4da6ff; }
    </style>
</head>
<body>
{% include '_navbar.html' %}
<div class="container dashboard-container">
    <div class="header-title">
        <div>
            <h3 class="mb-1">🌙 저녁 주식 요약</h3>
            <div class="text-muted small">매일 저녁 7시 30분 Slack 알림과 같은 내용입니다. Signal Score 기준일 <b id="scoreDate">-</b></div>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadDigest()">새로고침</button>
    </div>

    <div class="table-container">
        <h5>⭐ 관심 1순위 <small class="text-muted fw-normal">Signal Score A/B와 토스 후보에 동시에 걸린 종목</small></h5>
        <div class="table-scroll">
            <table class="table table-sm table-hover digest-table mb-0">
                <thead class="table-light"><tr><th>종목</th><th>등급</th><th>총점</th><th>토스 후보 사유</th></tr></thead>
                <tbody id="bothBody"></tbody>
            </table>
        </div>
    </div>

    <div class="table-container">
        <h5>🅰️ Signal Score A/B 상위</h5>
        <div class="table-scroll">
            <table class="table table-sm table-hover digest-table mb-0">
                <thead class="table-light"><tr><th>종목</th><th>등급</th><th>총점</th><th>모멘텀</th><th>수급</th><th>랭킹안정성</th><th>시장환경</th><th>리스크</th></tr></thead>
                <tbody id="gradedBody"></tbody>
            </table>
        </div>
    </div>

    <div class="table-container">
        <h5>📈 토스 스크리닝 후보 <small class="text-muted fw-normal">거래대금순</small></h5>
        <div class="table-scroll">
            <table class="table table-sm table-hover digest-table mb-0">
                <thead class="table-light"><tr><th>종목</th><th>현재가</th><th>등락률</th><th>사유</th></tr></thead>
                <tbody id="candidatesBody"></tbody>
            </table>
        </div>
    </div>

    <div class="text-muted small">※ 앱이 계산한 지표 요약이며 매수 권유가 아닙니다.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}
function stockLink(name, code) {
    return `<a class="ticker-link" href="https://finance.naver.com/item/main.nhn?code=${encodeURIComponent(code)}" target="_blank">${esc(name)}</a> <span class="text-muted">${esc(code)}</span>`;
}
function gradeBadge(g) {
    return `<span class="badge grade-${esc(g)}">${esc(g)}</span>`;
}
function reasonTags(reasons) {
    return (reasons || '').split('/').filter(r => r && r !== '-').map(r => `<span class="reason-tag">${esc(r)}</span>`).join('');
}
function emptyRow(cols, text) {
    return `<tr><td colspan="${cols}" class="text-center text-muted py-3">${text}</td></tr>`;
}
function rateCell(rate) {
    if (typeof rate !== 'number') return '-';
    const cls = rate > 0 ? 'up-rate' : (rate < 0 ? 'down-rate' : '');
    return `<span class="${cls}">${rate > 0 ? '+' : ''}${rate.toFixed(2)}%</span>`;
}

async function loadDigest() {
    const res = await fetch('api/stock-digest');
    const d = await res.json();
    if (d.status !== 'success') {
        document.getElementById('bothBody').innerHTML = emptyRow(4, '불러오기 실패: ' + esc(d.message));
        return;
    }
    document.getElementById('scoreDate').textContent = d.score_date || '-';

    document.getElementById('bothBody').innerHTML = d.both.length
        ? d.both.map(r => `<tr><td>${stockLink(r.name, r.code)}</td><td>${gradeBadge(r.grade)}</td><td><b>${esc(r.total_score)}</b></td><td>${reasonTags(r.reasons)}</td></tr>`).join('')
        : emptyRow(4, '두 목록에 동시에 걸린 종목이 없습니다.');

    // 표가 비었을 때 "데이터가 아예 없는지 / 조건에 맞는 종목만 없는지"를 구분해 보여준다
    const st = d.stats || {};
    const gc = st.grade_counts || {};
    const gradeText = ['A', 'B', 'C', '제외'].map(g => `${g} ${gc[g] || 0}`).join(' · ');
    const signalEmpty = st.signal_total
        ? `기준일 ${esc(d.score_date)} 계산 ${st.signal_total}종목 중 A/B등급이 없습니다. (${gradeText})`
        : 'Signal Score 계산 기록이 없습니다. 평일 15:40 시가총액 수집 + Signal Score 잡이 이 서버에서 아직 돌지 않았어요.';
    const screeningEmpty = st.screening_total
        ? `스크리닝 ${st.screening_total}종목 중 조건(일봉 돌파 / 200선 근접+구름 위 / 모멘텀)에 맞는 종목이 없습니다. (갱신 ${esc(st.screening_updated_at || '-')})`
        : '토스 스크리닝 데이터가 없습니다. toss-analysis-bot이 돌지 않았거나 토스 API 키가 설정되지 않았어요.';

    document.getElementById('gradedBody').innerHTML = d.graded.length
        ? d.graded.map(r => `<tr><td>${stockLink(r.name, r.code)}</td><td>${gradeBadge(r.grade)}</td><td><b>${esc(r.total_score)}</b></td>
            <td>${esc(r.momentum_score)}</td><td>${esc(r.supply_demand_score)}</td><td>${esc(r.rank_stability_score)}</td>
            <td>${esc(r.market_environment_score)}</td><td>${esc(r.risk_penalty_score)}</td></tr>`).join('')
        : emptyRow(8, signalEmpty);

    document.getElementById('candidatesBody').innerHTML = d.candidates.length
        ? d.candidates.map(s => `<tr><td>${stockLink(s.name, s.ticker)}</td><td>${typeof s.price === 'number' ? s.price.toLocaleString() : '-'}</td>
            <td>${rateCell(s.change_rate)}</td><td>${reasonTags(s.reasons)}</td></tr>`).join('')
        : emptyRow(4, screeningEmpty);
}
loadDigest();
</script>
</body>
</html>
