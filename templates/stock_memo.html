<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종목 메모</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
        .main-navbar { background-color: #1a1a2e; }
        .main-navbar .navbar-brand { color: #fff; font-weight: bold; }
        .main-navbar .nav-link { color: rgba(255,255,255,0.75) !important; font-size: 0.82rem; }
        .main-navbar .nav-link:hover,
        .main-navbar .nav-link.active { color: #fff !important; }
        .main-navbar .nav-link.active { border-bottom: 2px solid #4da6ff; }

        .dashboard-container { margin-top: 24px; margin-bottom: 60px; }
        .card-panel { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 16px 18px; }

        .memo-columns { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
        .memo-grade-col { flex: 0 0 280px; width: 280px; }
        .memo-grade-col .grade-col-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .memo-grade-col .grade-col-header h6 { margin: 0; font-size: 0.9rem; font-weight: 700; color: #1a1a2e; }
        .memo-grade-col .grade-count { font-size: 0.72rem; color: #94a3b8; background: #f1f5f9; border-radius: 10px; padding: 1px 8px; }
        .memo-col-list { max-height: calc(100vh - 320px); min-height: 120px; overflow-y: auto; }
        .memo-card { border: 1px solid #f1f5f9; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 0.8rem; }
        .memo-card .memo-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
        .memo-card .memo-card-code { font-family: monospace; font-size: 0.72rem; color: #94a3b8; }
        .memo-card .memo-card-name { font-weight: 600; color: #1e293b; }
        .memo-card .memo-card-text { white-space: pre-wrap; word-break: break-word; margin-top: 4px; }
        .memo-card .memo-card-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.68rem; color: #94a3b8; }
        .memo-card .memo-del-btn { background: none; border: none; color: #ef4444; font-size: 0.7rem; padding: 0; }
        .memo-card .memo-del-btn:hover { text-decoration: underline; }
        .empty-col { color: #cbd5e1; font-size: 0.78rem; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>

{% include '_navbar.html' %}
{% include '_stock_memo.html' %}

<div class="container-fluid dashboard-container px-4">

    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <h2 class="mb-0" style="font-size:1.2rem; font-weight:700; color:#1a1a2e">📝 종목 메모 전체보기 (등급별)</h2>
        <div class="d-flex gap-2">
            <input type="text" id="allSearchInput" class="form-control form-control-sm" style="width:220px"
                   placeholder="종목코드 · 종목명 · 메모 내용 검색">
            <button class="btn btn-outline-secondary btn-sm" onclick="loadAllMemos()">새로고침</button>
        </div>
    </div>

    <!-- 빠른 메모 추가 -->
    <div class="card-panel mb-3">
        <h6 class="mb-2" style="font-size:0.9rem">➕ 새 메모 추가</h6>
        <div class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label small mb-1">종목코드</label>
                <input type="text" id="quickCode" class="form-control form-control-sm" style="width:110px" placeholder="005930">
            </div>
            <div class="col-auto">
                <label class="form-label small mb-1">종목명</label>
                <input type="text" id="quickName" class="form-control form-control-sm" style="width:140px" placeholder="삼성전자">
            </div>
            <div class="col-auto">
                <label class="form-label small mb-1">등급</label>
                <select id="quickGrade" class="form-select form-select-sm" style="width:auto"></select>
            </div>
            <div class="col">
                <label class="form-label small mb-1">메모</label>
                <input type="text" id="quickMemo" class="form-control form-control-sm" placeholder="메모 내용 (URL을 넣으면 자동으로 링크가 됩니다)">
            </div>
            <div class="col-auto">
                <button class="btn btn-primary btn-sm" onclick="quickAddMemo()">추가</button>
            </div>
        </div>
    </div>

    <div class="memo-columns" id="memoColumns">
        <div class="text-muted small p-3">로딩 중...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let _allSearchTimer = null;
    let _gradeList = ['관심', '매수검토', '보유중', '매도검토', '기타'];

    function escHtml(s) {
        return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function linkifyHtml(s) {
        return escHtml(s).replace(/(https?:\/\/[^\s<]+)/g, url =>
            `<a href="${url}" target="_blank" rel="noopener">${url}</a>`
        );
    }

    async function loadGrades() {
        try {
            const res = await fetch('api/stock-memo/grades');
            const json = await res.json();
            if (json.data && json.data.length) _gradeList = json.data;
        } catch (e) { /* 기본값 유지 */ }
        document.getElementById('quickGrade').innerHTML =
            _gradeList.map(g => `<option value="${g}">${g}</option>`).join('');
    }

    async function loadAllMemos() {
        const q = document.getElementById('allSearchInput').value.trim();
        const box = document.getElementById('memoColumns');
        try {
            const url = q ? `api/stock-memo/all?q=${encodeURIComponent(q)}` : 'api/stock-memo/all';
            const res = await fetch(url);
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message);
            const rows = json.data || [];

            // 등급별로 묶기 (_gradeList 순서 유지, 목록에 없는 등급은 뒤에 추가)
            const grouped = {};
            _gradeList.forEach(g => grouped[g] = []);
            rows.forEach(r => {
                const g = r.grade || '기타';
                if (!grouped[g]) grouped[g] = [];
                grouped[g].push(r);
            });

            box.innerHTML = Object.entries(grouped).map(([grade, items]) => `
                <div class="memo-grade-col card-panel">
                    <div class="grade-col-header">
                        <h6>${escHtml(grade)}</h6>
                        <span class="grade-count">${items.length}건</span>
                    </div>
                    <div class="memo-col-list">
                        ${items.length ? items.map(r => `
                            <div class="memo-card">
                                <div class="memo-card-head">
                                    <span>
                                        <a href="https://finance.naver.com/item/main.naver?code=${r.code}" target="_blank" class="memo-card-name">${escHtml(r.name)}</a>
                                        <span class="memo-card-code">(${r.code})</span>
                                    </span>
                                    <button class="memo-del-btn" onclick="deleteAllMemoEntry(${r.id})">삭제</button>
                                </div>
                                <div class="memo-card-text">${linkifyHtml(r.memo)}</div>
                                <div class="memo-card-meta"><span>${r.created_at}</span></div>
                            </div>
                        `).join('') : '<div class="empty-col">메모 없음</div>'}
                    </div>
                </div>
            `).join('');
        } catch (e) {
            box.innerHTML = `<div class="text-danger small p-3">오류: ${e.message}</div>`;
        }
    }

    window.deleteAllMemoEntry = async function(id) {
        if (!confirm('이 메모를 삭제할까요?')) return;
        try {
            const res = await fetch(`api/stock-memo/${id}`, { method: 'DELETE' });
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message || '삭제 실패');
            loadAllMemos();
        } catch (e) {
            alert('삭제 실패: ' + e.message);
        }
    };

    async function quickAddMemo() {
        const code = document.getElementById('quickCode').value.trim();
        const name = document.getElementById('quickName').value.trim();
        const grade = document.getElementById('quickGrade').value;
        const memo = document.getElementById('quickMemo').value.trim();
        if (!code || !memo) { alert('종목코드와 메모 내용은 필수입니다.'); return; }
        try {
            const res = await fetch('api/stock-memo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, name, memo, grade })
            });
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message || '추가 실패');
            document.getElementById('quickCode').value = '';
            document.getElementById('quickName').value = '';
            document.getElementById('quickMemo').value = '';
            loadAllMemos();
        } catch (e) {
            alert('메모 추가 실패: ' + e.message);
        }
    }

    document.getElementById('allSearchInput').addEventListener('input', () => {
        clearTimeout(_allSearchTimer);
        _allSearchTimer = setTimeout(loadAllMemos, 300);
    });

    (async function init() {
        await loadGrades();
        await loadAllMemos();
    })();
</script>
</body>
</html>
