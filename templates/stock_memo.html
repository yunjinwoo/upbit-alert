<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종목 메모</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
        .main-navbar { background-color: #1a1a2e; }
        .main-navbar .navbar-brand { color: #fff; font-weight: bold; }
        .main-navbar .nav-link { color: rgba(255,255,255,0.75) !important; font-size: 0.82rem; }
        .main-navbar .nav-link:hover,
        .main-navbar .nav-link.active { color: #fff !important; }
        .main-navbar .nav-link.active { border-bottom: 2px solid #4da6ff; }

        .dashboard-container { margin-top: 24px; margin-bottom: 60px; }
        .card-panel { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 16px 18px; }

        .memo-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .memo-table th { background: #1a1a2e; color: #fff; padding: 8px; text-align: left; white-space: nowrap; font-weight: 600; }
        .memo-table td { padding: 8px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
        .memo-table tr:hover td { background: #f8fafc; }
        .memo-code { font-family: monospace; color: #94a3b8; font-size: 0.75rem; }
        .memo-text { white-space: pre-wrap; word-break: break-word; }
        .memo-meta { color: #94a3b8; font-size: 0.72rem; white-space: nowrap; }
        .memo-del-btn { background: none; border: none; color: #ef4444; font-size: 0.78rem; padding: 0; white-space: nowrap; }
        .memo-del-btn:hover { text-decoration: underline; }
        .loading-row td { text-align: center; color: #94a3b8; padding: 30px; }
    </style>
</head>
<body>

{% include '_navbar.html' %}
{% include '_stock_memo.html' %}

<div class="container-fluid dashboard-container px-4" style="max-width:1100px">

    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <h2 class="mb-0" style="font-size:1.2rem; font-weight:700; color:#1a1a2e">📝 종목 메모 전체보기</h2>
        <div class="d-flex gap-2">
            <input type="text" id="allSearchInput" class="form-control form-control-sm" style="width:220px"
                   placeholder="종목코드 · 종목명 · 메모 내용 검색">
            <button class="btn btn-outline-secondary btn-sm" onclick="loadAllMemos()">새로고침</button>
        </div>
    </div>

    <!-- 빠른 메모 추가 -->
    <div class="card-panel mb-3">
        <h6 class="mb-2" style="font-size:0.9rem">➕ 새 메모 추가</h6>
        <div class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label small mb-1">종목코드</label>
                <input type="text" id="quickCode" class="form-control form-control-sm" style="width:110px" placeholder="005930">
            </div>
            <div class="col-auto">
                <label class="form-label small mb-1">종목명</label>
                <input type="text" id="quickName" class="form-control form-control-sm" style="width:140px" placeholder="삼성전자">
            </div>
            <div class="col">
                <label class="form-label small mb-1">메모</label>
                <input type="text" id="quickMemo" class="form-control form-control-sm" placeholder="메모 내용 (URL을 넣으면 자동으로 링크가 됩니다)">
            </div>
            <div class="col-auto">
                <button class="btn btn-primary btn-sm" onclick="quickAddMemo()">추가</button>
            </div>
        </div>
    </div>

    <div class="card-panel">
        <div class="table-responsive">
            <table class="memo-table" id="allMemoTable">
                <thead>
                    <tr>
                        <th style="width:90px">종목코드</th>
                        <th style="width:110px">종목명</th>
                        <th>메모</th>
                        <th style="width:130px">작성일시</th>
                        <th style="width:50px"></th>
                    </tr>
                </thead>
                <tbody id="allMemoBody">
                    <tr class="loading-row"><td colspan="5">로딩 중...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="mt-2 small text-muted" id="allMemoCount"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let _allSearchTimer = null;

    function escHtml(s) {
        return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function linkifyHtml(s) {
        return escHtml(s).replace(/(https?:\/\/[^\s<]+)/g, url =>
            `<a href="${url}" target="_blank" rel="noopener">${url}</a>`
        );
    }

    async function loadAllMemos() {
        const q = document.getElementById('allSearchInput').value.trim();
        const body = document.getElementById('allMemoBody');
        body.innerHTML = '<tr class="loading-row"><td colspan="5">로딩 중...</td></tr>';
        try {
            const url = q ? `api/stock-memo/all?q=${encodeURIComponent(q)}` : 'api/stock-memo/all';
            const res = await fetch(url);
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message);
            const rows = json.data || [];
            document.getElementById('allMemoCount').textContent = `총 ${rows.length}건`;
            if (!rows.length) {
                body.innerHTML = '<tr class="loading-row"><td colspan="5">작성된 메모가 없습니다.</td></tr>';
                return;
            }
            body.innerHTML = rows.map(r => `
                <tr>
                    <td><a href="https://finance.naver.com/item/main.naver?code=${r.code}" target="_blank" class="memo-code">${r.code}</a></td>
                    <td>${escHtml(r.name)}</td>
                    <td class="memo-text">${linkifyHtml(r.memo)}</td>
                    <td class="memo-meta">${r.created_at}</td>
                    <td><button class="memo-del-btn" onclick="deleteAllMemoEntry(${r.id})">삭제</button></td>
                </tr>
            `).join('');
        } catch (e) {
            body.innerHTML = `<tr class="loading-row"><td colspan="5" class="text-danger">오류: ${e.message}</td></tr>`;
        }
    }

    window.deleteAllMemoEntry = async function(id) {
        if (!confirm('이 메모를 삭제할까요?')) return;
        try {
            const res = await fetch(`api/stock-memo/${id}`, { method: 'DELETE' });
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message || '삭제 실패');
            loadAllMemos();
        } catch (e) {
            alert('삭제 실패: ' + e.message);
        }
    };

    async function quickAddMemo() {
        const code = document.getElementById('quickCode').value.trim();
        const name = document.getElementById('quickName').value.trim();
        const memo = document.getElementById('quickMemo').value.trim();
        if (!code || !memo) { alert('종목코드와 메모 내용은 필수입니다.'); return; }
        try {
            const res = await fetch('api/stock-memo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, name, memo })
            });
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message || '추가 실패');
            document.getElementById('quickCode').value = '';
            document.getElementById('quickName').value = '';
            document.getElementById('quickMemo').value = '';
            loadAllMemos();
        } catch (e) {
            alert('메모 추가 실패: ' + e.message);
        }
    }

    document.getElementById('allSearchInput').addEventListener('input', () => {
        clearTimeout(_allSearchTimer);
        _allSearchTimer = setTimeout(loadAllMemos, 300);
    });

    loadAllMemos();
</script>
</body>
</html>
