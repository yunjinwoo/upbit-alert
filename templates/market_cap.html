<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국 주식 시가총액 순위 추이</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
        .dashboard-container { margin-top: 30px; margin-bottom: 50px; }
        .header-title { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .table-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .up-rate { color: #d60000; font-weight: bold; }
        .down-rate { color: #0049af; font-weight: bold; }
        .ticker-link { text-decoration: none; color: #0049af; font-weight: bold; cursor: pointer; }
        .ticker-link:hover { text-decoration: underline; }
        .rank-badge { font-size: 0.9rem; padding: 0.3em 0.6em; }
        .main-navbar { background-color: #1a1a2e; }
        .main-navbar .navbar-brand { color: #fff; font-weight: bold; }
        .main-navbar .nav-link { color: rgba(255,255,255,0.75) !important; }
        .main-navbar .nav-link:hover, .main-navbar .nav-link.active { color: #fff !important; }
        .main-navbar .nav-link.active { border-bottom: 2px solid #4da6ff; }
    </style>
</head>
<body>

<nav class="navbar main-navbar px-3">
    <a class="navbar-brand" href="{{ url_for('index') }}">📡 알림 시스템</a>
    <div class="d-flex gap-3">
        <a href="{{ url_for('index') }}" class="nav-link">대시보드</a>
        <a href="{{ url_for('market_cap_view') }}" class="nav-link active">시가총액 추이</a>
        <a href="{{ url_for('investor_trend_view') }}" class="nav-link">투자자별 매매동향</a>
        <a href="{{ url_for('sector_index_view') }}" class="nav-link">업종 일자별지수</a>
        <a href="{{ url_for('raw_data_view') }}" class="nav-link">원본 데이터</a>
    </div>
</nav>

<div class="container dashboard-container">
    <div class="header-title">
        <h2>📊 한국 주식 일별 시가총액 순위</h2>
        <div>
            <span id="update-timer" class="badge bg-secondary">로딩 중...</span>
            <button onclick="fetchNow()" class="btn btn-warning btn-sm ms-2 text-dark">즉시 수집</button>
            <button onclick="loadData()" class="btn btn-primary btn-sm ms-1">새로고침</button>
        </div>
    </div>

    <!-- 필터 영역 -->
    <div class="d-flex align-items-end gap-2 mb-3 flex-wrap">
        <button class="btn btn-outline-danger btn-sm" onclick="clearAll()">초기화</button>
        <div>
            <label class="form-label mb-1 small">시장 구분</label>
            <select id="inputIscd" class="form-select form-select-sm">
                <option value="combined">거래소+코스닥</option>
                <option value="0001">거래소</option>
                <option value="1001">코스닥</option>
                <option value="2001">코스피200</option>
            </select>
        </div>
        <div>
            <label class="form-label mb-1 small">주식 구분</label>
            <select id="divClsCode" class="form-select form-select-sm">
                <option value="0">전체</option>
                <option value="1">보통주</option>
                <option value="2">우선주</option>
            </select>
        </div>
        <div>
            <label class="form-label mb-1 small">날짜</label>
            <input type="date" id="dateSearch" class="form-control form-control-sm" style="width:145px">
        </div>
        <div>
            <label class="form-label mb-1 small">종목코드</label>
            <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="예: 005930" style="width:110px"
                   onkeypress="if(event.keyCode==13) loadData()">
        </div>
        <div>
            <label class="form-label mb-1 small">종목명</label>
            <input type="text" id="nameSearch" class="form-control form-control-sm" placeholder="예: 삼성" style="width:110px"
                   oninput="filterByName()">
        </div>
        <button class="btn btn-primary btn-sm" onclick="loadData()">조회</button>
    </div>

    <div class="table-container">
        <table id="marketCapTable" class="table table-hover" style="width:100%">
            <thead class="table-light">
                <tr>
                    <th>날짜</th>
                    <th>순위</th>
                    <th>종목명 (코드)</th>
                    <th class="text-end">시가총액 (억 원)</th>
                    <th class="text-end">시총 비중</th>
                    <th class="text-end">현재가</th>
                    <th class="text-end">등락률</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
    let dataTable;

    function clearAll() {
        document.getElementById('searchInput').value = '';
        document.getElementById('nameSearch').value = '';
        document.getElementById('dateSearch').value = '';
        document.getElementById('inputIscd').value = 'combined';
        document.getElementById('divClsCode').value = '0';
        if (dataTable) dataTable.search('').draw();
        loadData();
    }

    function filterByName() {
        if (dataTable) dataTable.search(document.getElementById('nameSearch').value).draw();
    }

    function getFilters() {
        return {
            inputIscd:  document.getElementById('inputIscd').value,
            divClsCode: document.getElementById('divClsCode').value,
        };
    }

    async function fetchNow() {
        if (!confirm("KIS API를 호출하여 시가총액 데이터를 지금 수집하시겠습니까?\n(당일 데이터는 덮어씌워집니다)")) return;

        const btn = document.querySelector('button[onclick="fetchNow()"]');
        btn.innerText = "수집 중...";
        btn.disabled = true;

        try {
            const { mrktDivCode, inputIscd, divClsCode } = getFilters();
            const res = await fetch('api/market-cap/fetch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mrkt_div_code: mrktDivCode, input_iscd: inputIscd, div_cls_code: divClsCode })
            });
            const result = await res.json();
            btn.innerText = "즉시 수집";
            btn.disabled = false;

            if (result.status === 'success') {
                alert(result.message);
                loadData();
            } else {
                alert("수집 실패: " + result.message);
            }
        } catch (e) {
            console.error(e);
            alert("서버 오류가 발생했습니다.");
            btn.innerText = "즉시 수집";
            btn.disabled = false;
        }
    }

    async function loadData() {
        const searchCode = document.getElementById('searchInput').value.trim();
        const dateVal    = document.getElementById('dateSearch').value.trim();
        const { inputIscd } = getFilters();
        let url = `api/market-cap?iscd=${inputIscd}`;
        if (searchCode) url += `&code=${searchCode}`;
        if (dateVal)    url += `&date=${dateVal}`;

        try {
            const res = await fetch(url);
            const result = await res.json();
            if (result.status !== 'success') return;

            if (dataTable) dataTable.destroy();

            document.getElementById('tableBody').innerHTML = result.data.map(item => {
                const mCap = parseInt(item.market_cap_amount).toLocaleString();
                const price = parseInt(item.price).toLocaleString();
                const rate = parseFloat(item.change_rate);
                const rateClass = rate > 0 ? 'up-rate' : (rate < 0 ? 'down-rate' : '');
                const rateSign = rate > 0 ? '+' : '';
                const weight = parseFloat(item.market_weight || 0).toFixed(2);

                return `
                    <tr>
                        <td><b>${item.date}</b></td>
                        <td><span class="badge rank-badge ${item.fid_input_iscd === '1001' ? 'bg-success' : 'bg-primary'}">${item.rank}위</span></td>
                        <td>
                            <a href="https://finance.naver.com/item/main.nhn?code=${item.code}" target="_blank" class="ticker-link">
                                ${item.name} <small class="text-muted">(${item.code})</small>
                            </a>
                        </td>
                        <td class="text-end">${mCap}</td>
                        <td class="text-end">${weight}%</td>
                        <td class="text-end">${price}원</td>
                        <td class="text-end"><span class="${rateClass}">${rateSign}${rate}%</span></td>
                    </tr>`;
            }).join('');

            // 날짜 내림차순 → 시가총액(3번째 컬럼) 내림차순
            const orderOption = [[0, 'desc'], [3, 'desc']];
            dataTable = $('#marketCapTable').DataTable({
                order: orderOption,
                pageLength: 100,
                language: {
                    search: "결과 내 검색:",
                    lengthMenu: "_MENU_ 개씩 보기",
                    info: "총 _TOTAL_ 건 중 _START_~_END_ 표시"
                }
            });
            document.getElementById('update-timer').innerText = `최근 업데이트: ${new Date().toLocaleTimeString()}`;
        } catch (e) {
            console.error(e);
            alert('데이터를 불러오는데 실패했습니다.');
        }
    }

    document.addEventListener("DOMContentLoaded", loadData);
</script>
</body>
</html>
