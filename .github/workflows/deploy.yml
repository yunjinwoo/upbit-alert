name: Deploy to iwinv

on:
  push:
    branches: [ main ] # 메인 브랜치에 푸시될 때 실행됩니다.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}        # GitHub Secrets에 등록한 서버 IP
          username: ${{ secrets.SERVER_USER }}  # GitHub Secrets에 등록한 'deploy-user'
          key: ${{ secrets.SSH_PRIVATE_KEY }}    # GitHub Secrets에 등록한 id_ed25519 비밀키
          port: 22                             # iwinv 기본 SSH 포트
          script: |
            # 1. 프로젝트 폴더로 이동 (폴더가 없으면 생성)
            mkdir -p ~/upbit-alert
            cd ~/upbit-alert
            
            # 2. 소스 코드 업데이트 (강제 업데이트 방식)
            git fetch --all
            git reset --hard origin/main

            # 3. 필요한 환경변수 보장 (.env에 없으면 추가)
            # .env 마지막 줄에 개행이 없는 채로 끝나있으면 `>>`로 그냥 이어붙일 때 이전 줄에
            # 붙어버려(예: SECRET_KEY=abc123APP_ROOT=/upbit) 두 값 다 깨지는 문제가 있어,
            # 항상 빈 줄 하나를 앞세워 새 줄에서 시작하도록 printf로 추가한다.
            # (로컬/서버 구분용 APP_ENV는 더 이상 .env에 넣지 않음 — app/config.py가 OS로 자동 판별)
            grep -q "APP_ROOT" .env 2>/dev/null || printf '\nAPP_ROOT=/upbit\n' >> .env

            # 4. 필요한 라이브러리 설치
            # 반드시 venv의 pip를 써야 함 — 그냥 pip는 시스템 파이썬에 설치되어 버려서,
            # 실제 앱이 도는 ./venv/bin/python3 쪽엔 패키지가 반영되지 않는 문제가 있었음
            ./venv/bin/pip install -r requirements.txt
            
            # 4. PM2를 이용한 프로세스 재시작
            # 기존 프로세스가 있다면 중지 후 삭제 (확실한 재시작을 위해)
            pm2 delete upbit-bot upbit-api stock-bot coin-analysis-bot trade-bot condition-check-bot || true

            # 가상환경 내의 python3 경로를 정확히 지정하여 실행
            pm2 start main.py --name upbit-api --interpreter ./venv/bin/python3 -- api
            pm2 start main.py --name upbit-bot --interpreter ./venv/bin/python3 -- upbit
            pm2 start main.py --name stock-bot --interpreter ./venv/bin/python3 -- stock
            # coin-analysis-bot: 자동매매 진입 후보(coin_screening_daily)를 30분 주기로 채움 —
            # trade-bot이 이 데이터에 의존하므로 반드시 같이 떠 있어야 함(그동안 서버엔 안 떠 있었음)
            pm2 start main.py --name coin-analysis-bot --interpreter ./venv/bin/python3 -- coin_analysis
            # trade-bot: 업비트 자동매매 1단계(모의매매/dry-run) — 실주문 없음, DB 가상 원장에만 반영.
            # 대시보드(/auto-trade)에서 실행/일시중지 토글 및 매매 기준 조정 가능(재시작 불필요)
            pm2 start main.py --name trade-bot --interpreter ./venv/bin/python3 -- trade
            # condition-check-bot: 정밀 매수조건(일봉/5분봉/1분봉) 검사 — 대시보드에서 "정밀검사" 체크한
            # 종목만 별도 주기로 조회(trade-bot과 격리된 프로세스, 안 떠 있으면 정밀검사 켠 종목은 매수 보류됨)
            pm2 start main.py --name condition-check-bot --interpreter ./venv/bin/python3 -- condition_check

            # 5. 설정 저장 (서버 재부팅 시 자동 실행)
            pm2 save
            
            # 6. 결과 노출....
            pm2 list
